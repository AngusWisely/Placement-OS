<!doctype html>
<html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Placement OS</title>
<style>
:root{--bg:#f6f7f5;--panel:#fff;--text:#1f2933;--muted:#6b7280;--line:#e5e7eb;--accent:#136f63;--soft:#e8f3f0;--danger:#a8453c;font-family:system-ui,-apple-system,sans-serif}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text)}.app{display:grid;grid-template-columns:220px 1fr;min-height:100vh}.side{border-right:1px solid var(--line);padding:24px 16px}.brand{font-size:20px;font-weight:700;margin:0 0 28px 10px}.nav a{display:block;padding:10px 12px;border-radius:9px;text-decoration:none;color:inherit;margin-bottom:5px}.nav a.active,.nav a:hover{background:var(--soft)}main{padding:34px 5vw 70px;max-width:1100px}h1{margin:0 0 6px;font-size:30px}.sub{color:var(--muted);margin:0 0 26px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.card,.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px}.card h3{margin:0 0 4px}.meta{color:var(--muted);font-size:13px}.badge{font-size:12px;font-weight:700;color:var(--accent)}.row{display:grid;grid-template-columns:1fr auto;gap:14px;padding:12px 0;border-bottom:1px solid var(--line)}.row:last-child{border-bottom:0}.btn{border:1px solid var(--line);background:var(--panel);padding:9px 14px;border-radius:9px;font-weight:600;cursor:pointer}.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}.toolbar{display:flex;gap:10px;margin:0 0 18px}.form{display:grid;grid-template-columns:1fr 1fr;gap:12px}.form label{display:grid;gap:5px;font-size:13px;color:var(--muted)}input,select,textarea{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:#fff;color:#111}.wide{grid-column:1/-1}textarea{min-height:100px}.hidden{display:none}.status{font-size:12px;font-weight:700;color:var(--accent)}@media(max-width:760px){.app{display:block}.side{border-right:0;border-bottom:1px solid var(--line)}.nav{display:flex;gap:6px;overflow:auto}.nav a{white-space:nowrap}.grid,.form{grid-template-columns:1fr}main{padding:22px 16px}}
</style></head><body><div class="app"><aside class="side"><p class="brand">Placement OS</p><nav class="nav"><a href="#/" data-page="home">Home</a><a href="#/applications" data-page="applications">Applications</a><a href="#/companies" data-page="companies">Companies</a><a href="#/profile" data-page="profile">Profile</a></nav></aside><main id="view"></main></div>
<script>
const view=document.getElementById('view');const api=async(path,opt={})=>{const r=await fetch(path,{...opt,headers:{'Content-Type':'application/json',...(opt.headers||{})}});const d=await r.json();if(!r.ok)throw new Error(d.error||r.statusText);return d};const h=(t,a={},...c)=>{const e=document.createElement(t);for(const[k,v]of Object.entries(a)){if(k.startsWith('on'))e.addEventListener(k.slice(2),v);else e.setAttribute(k,v)}for(const x of c.flat())if(x!==null&&x!==undefined)e.append(x instanceof Node?x:document.createTextNode(String(x)));return e};const show=(...c)=>view.replaceChildren(...c.flat());
function nav(page){document.querySelectorAll('.nav a').forEach(a=>a.classList.toggle('active',a.dataset.page===page))}
function appCard(a){return h('div',{class:'card'},h('h3',{},a.company),h('div',{class:'meta'},a.role+(a.location?' · '+a.location:'')),h('p',{class:'status'},a.status),a.deadline?h('div',{class:'meta'},'Deadline: '+a.deadline):null,a.next_action?h('div',{class:'meta'},'Next: '+a.next_action):null,h('div',{style:'margin-top:12px'},h('button',{class:'btn',onclick:()=>editForm(a)},'Open')))}
async function home(){nav('home');const d=await api('/api/home');show(h('h1',{},'Placement OS'),h('p',{class:'sub'},'What needs your attention next.'),h('h2',{},'Next actions'),d.actions.length?h('div',{class:'grid'},d.actions.map(appCard)):h('p',{class:'sub'},'No next actions yet.'),h('h2',{style:'margin-top:28px'},'Upcoming deadlines'),d.deadlines.length?h('div',{class:'grid'},d.deadlines.map(appCard)):h('p',{class:'sub'},'No deadlines saved yet.'))}
async function applications(){nav('applications');const apps=await api('/api/applications');show(h('div',{class:'toolbar'},h('button',{class:'btn primary',onclick:()=>editForm(null)},'Add application')),h('h1',{},'Applications'),h('p',{class:'sub'},apps.length+' tracked'),apps.length?h('div',{class:'grid'},apps.map(appCard)):h('p',{class:'sub'},'No applications yet. Add your first role.'))}
function field(label,name,value='',type='text'){return h('label',{},label,h('input',{name,type,value:value||''}))}
function editForm(app){nav('applications');const form=h('form',{class:'panel form'},field('Company','company',app?.company),field('Role','role',app?.role),field('Location','location',app?.location),field('Job URL','job_url',app?.job_url),field('Deadline','deadline',app?.deadline,'date'),h('label',{},'Status',h('select',{name:'status'},...['Saved','Researching','Applying','Applied','Assessment','Interview','Offer','Rejected','Closed'].map(s=>h('option',{value:s,selected:app?.status===s?'selected':null},s)))),field('Application date','application_date',app?.application_date,'date'),field('Next action','next_action',app?.next_action),field('Next action date','next_action_date',app?.next_action_date,'date'),field('Contact name','contact_name',app?.contact_name),field('LinkedIn URL','contact_linkedin',app?.contact_linkedin),h('label',{class:'wide'},'Notes',h('textarea',{name:'notes'},app?.notes||'')),h('div',{class:'wide toolbar'},h('button',{class:'btn primary',type:'submit'},app?'Save changes':'Add application'),app?h('button',{class:'btn',type:'button',onclick:async()=>{if(confirm('Delete this application?')){await api('/api/applications/'+app.id,{method:'DELETE'});location.hash='#/applications'}}},'Delete'):null));form.addEventListener('submit',async e=>{e.preventDefault();const data=Object.fromEntries(new FormData(form));await api(app?'/api/applications/'+app.id:'/api/applications',{method:app?'PUT':'POST',body:JSON.stringify(data)});location.hash='#/applications'});show(h('h1',{},app?'Application':'New application'),h('p',{class:'sub'},app?app.company+' · '+app.role:'Save a role before you forget it.'),form)}
async function companies(){nav('companies');const apps=await api('/api/applications');const map=new Map();for(const a of apps){if(!map.has(a.company))map.set(a.company,[]);map.get(a.company).push(a)}show(h('h1',{},'Companies'),h('p',{class:'sub'},'A simple view of where you are applying.'),map.size?h('div',{class:'grid'},[...map].map(([name,items])=>h('div',{class:'card'},h('h3',{},name),h('div',{class:'meta'},items.length+' role'+(items.length===1?'':'s')),items.map(x=>h('div',{class:'meta',style:'margin-top:6px'},x.role+' · '+x.status))))):h('p',{class:'sub'},'Companies appear here once you add applications.'))}
function profile(){nav('profile');show(h('h1',{},'Profile'),h('p',{class:'sub'},'This is where your CV evidence and strengths will live in V0.2.'),h('div',{class:'panel'},h('h2',{},'Coming next'),h('p',{},'Skills, projects, experience and evidence that can be matched against job adverts.')))}
async function route(){const p=(location.hash.slice(2)||'');try{if(p==='applications')await applications();else if(p==='companies')await companies();else if(p==='profile')profile();else await home()}catch(e){show(h('p',{},'Could not load: '+e.message))}}window.addEventListener('hashchange',route);route();
</script></body></html>
