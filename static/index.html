<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Placement OS</title>
<style>
:root{--bg:#f6f7f5;--panel:#fff;--text:#1f2933;--muted:#6b7280;--line:#e5e7eb;--accent:#136f63;--soft:#e8f3f0;--danger:#a8453c;--warn:#b7791f;font-family:system-ui,-apple-system,sans-serif}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text)}.app{display:grid;grid-template-columns:220px 1fr;min-height:100vh}.side{border-right:1px solid var(--line);padding:24px 16px}.brand{font-size:20px;font-weight:700;margin:0 0 28px 10px}.nav a{display:block;padding:10px 12px;border-radius:9px;text-decoration:none;color:inherit;margin-bottom:5px}.nav a.active,.nav a:hover{background:var(--soft)}
main{padding:34px 5vw 70px;max-width:1100px;width:100%}h1{margin:0 0 6px;font-size:30px}h2{margin:26px 0 12px;font-size:18px}.sub{color:var(--muted);margin:0 0 26px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.card,.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px}.card h3{margin:0 0 4px}.meta,.mini{color:var(--muted);font-size:13px}.mini{font-size:12px}.status{font-size:12px;font-weight:700;color:var(--accent)}.btn{border:1px solid var(--line);background:var(--panel);padding:9px 14px;border-radius:9px;font-weight:600;cursor:pointer}.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}.btn.danger{color:var(--danger)}.toolbar{display:flex;flex-wrap:wrap;gap:10px;margin:12px 0 18px}.form{display:grid;grid-template-columns:1fr 1fr;gap:12px}.form label{display:grid;gap:5px;font-size:13px;color:var(--muted)}input,select,textarea{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:#fff;color:#111}.wide{grid-column:1/-1}textarea{min-height:100px}.advert{min-height:240px}.analysis{display:grid;gap:14px;margin-top:18px}.score{font-size:36px;font-weight:800;color:var(--accent);line-height:1}.analysis-list{display:grid;gap:10px}.analysis-item{border:1px solid var(--line);border-radius:10px;padding:12px}.analysis-item.match{border-left:4px solid var(--accent)}.analysis-item.gap{border-left:4px solid var(--warn)}.analysis-item h4{margin:0 0 4px}.evidence{margin-top:8px;color:var(--muted);font-size:13px}.empty{color:var(--muted);font-size:14px}
.job-card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px}.job-card h3{margin:0 0 4px}.job-top{display:flex;justify-content:space-between;gap:14px;align-items:flex-start}.match-pill{font-size:12px;font-weight:800;color:var(--accent);background:var(--soft);padding:4px 8px;border-radius:999px;white-space:nowrap}.source{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}.setup{border-left:4px solid var(--warn)}.job-list{display:grid;gap:12px}.salary{font-size:12px;color:var(--muted);margin-top:4px}.new-pill{font-size:11px;font-weight:800;color:var(--accent);background:var(--soft);padding:3px 7px;border-radius:999px;margin-left:6px}.muted-btn{color:var(--muted)}.import-row{display:grid;grid-template-columns:1fr auto;gap:10px}.today-hero{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:24px}.metric{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px}.metric strong{display:block;font-size:24px}.metric span{font-size:12px;color:var(--muted)}
@media(max-width:760px){.today-hero{grid-template-columns:1fr}.import-row{grid-template-columns:1fr}.app{display:block}.side{border-right:0;border-bottom:1px solid var(--line)}.nav{display:flex;gap:6px;overflow:auto}.nav a{white-space:nowrap}.grid,.form{grid-template-columns:1fr}main{padding:22px 16px}}
</style>
</head>
<body>
<div class="app">
<aside class="side">
<p class="brand">Placement OS</p>
<nav class="nav">
<a href="#/" data-page="home">Today</a>
<a href="#/find" data-page="find">Find roles</a>
<a href="#/applications" data-page="applications">Applications</a>
<a href="#/companies" data-page="companies">Companies</a>
<a href="#/profile" data-page="profile">Profile</a>
</nav>
</aside>
<main id="view"></main>
</div>
<script>
const view = document.getElementById("view");

async function api(path, options = {}) {
  const response = await fetch(path, {
    ...options,
    headers: {"Content-Type": "application/json", ...(options.headers || {})}
  });
  const data = await response.json();
  if (!response.ok) throw new Error(data.error || response.statusText);
  return data;
}

function h(tag, attrs = {}, ...children) {
  const el = document.createElement(tag);
  for (const [key, value] of Object.entries(attrs)) {
    if (value === null || value === undefined || value === false) continue;
    if (key.startsWith("on")) el.addEventListener(key.slice(2), value);
    else el.setAttribute(key, value === true ? "" : value);
  }
  for (const child of children.flat(Infinity)) {
    if (child === null || child === undefined || child === false) continue;
    el.append(child instanceof Node ? child : document.createTextNode(String(child)));
  }
  return el;
}

function show(...children) {
  view.replaceChildren(...children.flat(Infinity));
}

function nav(page) {
  document.querySelectorAll(".nav a").forEach(a => a.classList.toggle("active", a.dataset.page === page));
}

function field(label, name, value = "", type = "text") {
  return h("label", {}, label, h("input", {name, type, value: value || ""}));
}

function appCard(app) {
  return h("div", {class:"card"},
    h("h3", {}, app.company),
    h("div", {class:"meta"}, app.role + (app.location ? " · " + app.location : "")),
    h("p", {class:"status"}, app.status),
    app.deadline ? h("div", {class:"meta"}, "Deadline: " + app.deadline) : null,
    app.next_action ? h("div", {class:"meta"}, "Next: " + app.next_action) : null,
    h("div", {class:"toolbar"},
      h("button", {class:"btn", onclick:() => editForm(app)}, "Open"),
      h("button", {class:"btn primary", onclick:() => analysisPage(app)}, "Analyse advert")
    )
  );
}

async function home() {
  nav("home");
  const data = await api("/api/home");
  const discoveryStatus = await api("/api/discovery/status");
  let newRoles = 0;

  const newRolesBox = h("div", {class:"metric"},
    h("strong", {}, "—"),
    h("span", {}, discoveryStatus.configured ? "new roles this session" : "job search not connected")
  );

  show(
    h("h1", {}, "Today"),
    h("p", {class:"sub"}, "The few things worth your attention right now."),
    h("div", {class:"today-hero"},
      newRolesBox,
      h("div", {class:"metric"}, h("strong", {}, data.actions.length), h("span", {}, "applications needing action")),
      h("div", {class:"metric"}, h("strong", {}, data.deadlines.length), h("span", {}, "upcoming deadlines"))
    ),
    h("div", {class:"toolbar"},
      h("a", {class:"btn primary", href:"#/find"}, "Find placements"),
      h("a", {class:"btn", href:"#/applications"}, "Applications")
    ),
    h("h2", {}, "Next actions"),
    data.actions.length ? h("div", {class:"grid"}, data.actions.map(appCard)) : h("p", {class:"empty"}, "Nothing waiting for you."),
    h("h2", {}, "Upcoming deadlines"),
    data.deadlines.length ? h("div", {class:"grid"}, data.deadlines.map(appCard)) : h("p", {class:"empty"}, "No upcoming deadlines saved.")
  );

  if (discoveryStatus.configured && !sessionStorage.getItem("placement-os-auto-search")) {
    sessionStorage.setItem("placement-os-auto-search", "1");
    try {
      const found = await api("/api/discover", {method:"POST", body:"{}"});
      newRoles = found.new_count || 0;
      newRolesBox.replaceChildren(
        h("strong", {}, newRoles),
        h("span", {}, newRoles === 1 ? "new placement found" : "new placements found")
      );
    } catch (_) {
      newRolesBox.replaceChildren(h("strong", {}, "—"), h("span", {}, "job search unavailable"));
    }
  } else if (discoveryStatus.configured) {
    newRolesBox.replaceChildren(h("strong", {}, "✓"), h("span", {}, "placements checked this session"));
  }
}

async function applications() {
  nav("applications");
  const apps = await api("/api/applications");

  const urlInput = h("input", {type:"url", placeholder:"Paste a job advert URL…"});
  const importButton = h("button", {class:"btn"}, "Import URL");
  importButton.addEventListener("click", async () => {
    if (!urlInput.value.trim()) return;
    importButton.disabled = true;
    importButton.textContent = "Importing…";
    try {
      const app = await api("/api/import-url", {
        method:"POST",
        body:JSON.stringify({url:urlInput.value})
      });
      editForm(app);
    } catch (error) {
      alert(error.message);
      importButton.disabled = false;
      importButton.textContent = "Import URL";
    }
  });

  show(
    h("h1", {}, "Applications"),
    h("p", {class:"sub"}, apps.length + " tracked"),
    h("div", {class:"panel"},
      h("div", {class:"import-row"}, urlInput, importButton),
      h("p", {class:"mini"}, "Paste a public job URL and Placement OS will try to create the application and analyse the advert for you.")
    ),
    h("div", {class:"toolbar"},
      h("button", {class:"btn primary", onclick:() => editForm(null)}, "Add manually")
    ),
    apps.length ? h("div", {class:"grid"}, apps.map(appCard)) : h("p", {class:"empty"}, "No applications yet.")
  );
}

function editForm(app) {
  nav("applications");
  const statusOptions = ["Saved","Researching","Applying","Applied","Assessment","Interview","Offer","Rejected","Closed"];
  const status = h("select", {name:"status"});
  for (const value of statusOptions) {
    status.append(h("option", {value, selected:app && app.status === value}, value));
  }

  const form = h("form", {class:"panel form"},
    field("Company","company",app?.company),
    field("Role","role",app?.role),
    field("Location","location",app?.location),
    field("Job URL","job_url",app?.job_url),
    field("Deadline","deadline",app?.deadline,"date"),
    h("label", {}, "Status", status),
    field("Application date","application_date",app?.application_date,"date"),
    field("Next action","next_action",app?.next_action),
    field("Next action date","next_action_date",app?.next_action_date,"date"),
    field("Contact name","contact_name",app?.contact_name),
    field("LinkedIn URL","contact_linkedin",app?.contact_linkedin),
    h("label", {class:"wide"}, "Notes", h("textarea", {name:"notes"}, app?.notes || ""))
  );

  const actions = h("div", {class:"wide toolbar"});
  actions.append(h("button", {class:"btn primary", type:"submit"}, app ? "Save changes" : "Add application"));
  if (app) {
    actions.append(h("button", {class:"btn", type:"button", onclick:() => analysisPage(app)}, "Analyse advert"));
    actions.append(h("button", {
      class:"btn danger",
      type:"button",
      onclick:async () => {
        if (!confirm("Delete this application?")) return;
        await api("/api/applications/" + app.id, {method:"DELETE"});
        location.hash = "#/applications";
      }
    }, "Delete"));
  }
  form.append(actions);

  form.addEventListener("submit", async event => {
    event.preventDefault();
    const data = Object.fromEntries(new FormData(form));
    await api(app ? "/api/applications/" + app.id : "/api/applications", {
      method: app ? "PUT" : "POST",
      body: JSON.stringify(data)
    });
    location.hash = "#/applications";
  });

  show(
    h("h1", {}, app ? "Application" : "New application"),
    h("p", {class:"sub"}, app ? app.company + " · " + app.role : "Save a role before you forget it."),
    form
  );
}

async function companies() {
  nav("companies");
  const apps = await api("/api/applications");
  const grouped = new Map();
  for (const app of apps) {
    if (!grouped.has(app.company)) grouped.set(app.company, []);
    grouped.get(app.company).push(app);
  }
  const cards = [];
  for (const [name, items] of grouped) {
    cards.push(h("div", {class:"card"},
      h("h3", {}, name),
      h("div", {class:"meta"}, items.length + " role" + (items.length === 1 ? "" : "s")),
      items.map(item => h("div", {class:"meta", style:"margin-top:6px"}, item.role + " · " + item.status))
    ));
  }
  show(
    h("h1", {}, "Companies"),
    h("p", {class:"sub"}, "A simple view of where you are applying."),
    cards.length ? h("div", {class:"grid"}, cards) : h("p", {class:"empty"}, "Companies appear here once you add applications.")
  );
}

async function profile() {
  nav("profile");
  const items = await api("/api/profile");

  const type = h("select", {name:"type"});
  for (const value of ["project","skill","experience","coursework","achievement"]) {
    type.append(h("option", {value}, value));
  }

  const form = h("form", {class:"panel form"},
    h("label", {}, "Type", type),
    field("Title","title"),
    h("label", {class:"wide"}, "Evidence", h("textarea", {name:"detail", placeholder:"What did you actually do, build, analyse or achieve?"})),
    field("Keywords","keywords")
  );
  form.append(h("div", {class:"wide"}, h("button", {class:"btn primary", type:"submit"}, "Add evidence")));
  form.addEventListener("submit", async event => {
    event.preventDefault();
    await api("/api/profile", {method:"POST", body:JSON.stringify(Object.fromEntries(new FormData(form)))});
    await profile();
  });

  const cards = items.map(item =>
    h("div", {class:"card"},
      h("div", {class:"mini"}, item.type),
      h("h3", {}, item.title),
      h("p", {class:"meta"}, item.detail),
      item.keywords ? h("p", {class:"mini"}, "Keywords: " + item.keywords) : null,
      h("button", {
        class:"btn danger",
        onclick:async () => {
          await api("/api/profile/" + item.id, {method:"DELETE"});
          await profile();
        }
      }, "Remove")
    )
  );

  show(
    h("h1", {}, "Profile evidence"),
    h("p", {class:"sub"}, "Store concrete examples the matcher can use."),
    form,
    h("h2", {}, "Your evidence"),
    cards.length ? h("div", {class:"grid"}, cards) : h("p", {class:"empty"}, "Add projects, skills and experience before analysing adverts.")
  );
}

function analysisResult(result) {
  const matches = result.matches.length
    ? h("div", {class:"analysis-list"}, result.matches.map(match =>
        h("div", {class:"analysis-item match"},
          h("h4", {}, match.name),
          h("div", {class:"mini"}, match.importance),
          h("div", {class:"evidence"}, match.evidence.map(ev =>
            h("div", {}, "• " + ev.title + (ev.detail ? " — " + ev.detail : ""))
          ))
        )
      ))
    : h("p", {class:"empty"}, "No profile evidence matched yet.");

  const gaps = result.gaps.length
    ? h("div", {class:"analysis-list"}, result.gaps.map(gap =>
        h("div", {class:"analysis-item gap"},
          h("h4", {}, gap.name),
          h("div", {class:"mini"}, gap.importance),
          h("div", {class:"meta"}, gap.excerpt)
        )
      ))
    : h("p", {class:"empty"}, "No recognised gaps from the requirements found.");

  return h("div", {class:"analysis"},
    h("div", {class:"panel"},
      h("div", {class:"score"}, result.score + "%"),
      h("div", {class:"meta"}, result.summary)
    ),
    h("div", {}, h("h2", {}, "Strong matches"), matches),
    h("div", {}, h("h2", {}, "Gaps"), gaps)
  );
}

async function analysisPage(app) {
  nav("applications");
  let saved = null;
  try {
    saved = app.analysis_json ? JSON.parse(app.analysis_json) : null;
  } catch (_) {}

  const advert = h("textarea", {class:"advert", placeholder:"Paste the full job advert here..."}, app.job_advert || "");
  const resultBox = h("div", {});
  if (saved) resultBox.append(analysisResult(saved));

  const analyseButton = h("button", {class:"btn primary"}, saved ? "Analyse again" : "Analyse advert");
  analyseButton.addEventListener("click", async () => {
    analyseButton.disabled = true;
    analyseButton.textContent = "Analysing…";
    try {
      const result = await api("/api/analyse/" + app.id, {
        method:"POST",
        body:JSON.stringify({advert: advert.value})
      });
      resultBox.replaceChildren(analysisResult(result));
      analyseButton.textContent = "Analyse again";
    } catch (error) {
      alert(error.message);
      analyseButton.textContent = "Try again";
    } finally {
      analyseButton.disabled = false;
    }
  });

  show(
    h("h1", {}, app.company),
    h("p", {class:"sub"}, app.role),
    h("div", {class:"panel"},
      h("h2", {}, "Job advert"),
      h("p", {class:"meta"}, "Paste the advert exactly as you found it. Matching is based on your Profile evidence."),
      advert,
      h("div", {class:"toolbar"},
        analyseButton,
        h("button", {class:"btn", onclick:() => editForm(app)}, "Back to application")
      )
    ),
    resultBox
  );
}


function money(value) {
  if (!value) return "";
  return "£" + Math.round(value).toLocaleString("en-GB");
}

function jobCard(job) {
  const salary = job.salary_min || job.salary_max
    ? [money(job.salary_min), money(job.salary_max)].filter(Boolean).join("–")
    : "";

  const card = h("div", {class:"job-card"});
  const save = h("button", {class:"btn primary"}, job.saved_application_id ? "Saved" : "Save");
  const apply = h("button", {class:"btn"}, job.saved_application_id ? "Open advert" : "Apply");
  const hide = h("button", {class:"btn muted-btn"}, "Hide");

  if (job.saved_application_id) save.disabled = true;

  async function saveJob(status) {
    if (job.saved_application_id) {
      window.open(job.url, "_blank", "noopener");
      return;
    }
    const button = status === "Applying" ? apply : save;
    button.disabled = true;
    button.textContent = status === "Applying" ? "Saving…" : "Saving…";
    try {
      const app = await api("/api/discovery/save", {
        method:"POST",
        body:JSON.stringify({...job, status})
      });
      job.saved_application_id = app.id;
      save.textContent = "Saved";
      save.disabled = true;
      if (status === "Applying") {
        apply.textContent = "Opening…";
        window.open(job.url, "_blank", "noopener");
        setTimeout(() => { apply.textContent = "Open advert"; apply.disabled = false; }, 300);
      }
    } catch (error) {
      alert(error.message);
      button.disabled = false;
      button.textContent = status === "Applying" ? "Apply" : "Save";
    }
  }

  save.addEventListener("click", () => saveJob("Saved"));
  apply.addEventListener("click", () => saveJob("Applying"));
  hide.addEventListener("click", async () => {
    await api("/api/discovery/hide", {method:"POST", body:JSON.stringify({job_key:job.job_key})});
    card.remove();
  });

  card.append(
    h("div", {class:"job-top"},
      h("div", {},
        h("div", {class:"source"}, job.source, job.is_new ? h("span", {class:"new-pill"}, "NEW") : null),
        h("h3", {}, job.title),
        h("div", {class:"meta"}, (job.company || "Unknown employer") + (job.location ? " · " + job.location : "")),
        salary ? h("div", {class:"salary"}, salary) : null
      ),
      h("div", {class:"match-pill"}, job.relevance + "% relevant")
    ),
    h("p", {class:"meta"}, job.analysis?.summary || ""),
    h("div", {class:"toolbar"},
      h("a", {class:"btn", href:job.url, target:"_blank", rel:"noopener"}, "View"),
      save,
      apply,
      hide
    )
  );
  return card;
}

async function findRoles() {
  nav("find");
  let status = await api("/api/discovery/status");
  let prefs = await api("/api/preferences");
  const resultsBox = h("div", {});
  const locationInput = h("input", {type:"text", value:prefs.location || "", placeholder:"Manchester, Nottingham, London…"});
  const relevanceInput = h("input", {type:"number", min:"0", max:"100", value:String(prefs.min_relevance || 0)});

  const searchButton = h("button", {class:"btn primary"}, "Search placements");
  searchButton.addEventListener("click", async () => {
    searchButton.disabled = true;
    searchButton.textContent = "Searching…";
    resultsBox.replaceChildren(h("p", {class:"sub"}, "Checking current placement adverts…"));
    try {
      prefs = await api("/api/preferences", {
        method:"POST",
        body:JSON.stringify({
          location:locationInput.value,
          min_relevance:Number(relevanceInput.value || 0)
        })
      });
      const data = await api("/api/discover", {
        method:"POST",
        body:JSON.stringify({location:prefs.location})
      });
      resultsBox.replaceChildren(
        h("h2", {}, "Matches"),
        h("p", {class:"sub"}, data.new_count + " new · " + data.count + " visible"),
        data.results.length
          ? h("div", {class:"job-list"}, data.results.map(jobCard))
          : h("p", {class:"empty"}, "No visible matches. Try a broader location or lower minimum relevance.")
      );
    } catch (error) {
      resultsBox.replaceChildren(h("div", {class:"panel setup"},
        h("h3", {}, "Search failed"),
        h("p", {class:"meta"}, error.message)
      ));
    } finally {
      searchButton.disabled = false;
      searchButton.textContent = "Search placements";
    }
  });

  let setup = null;
  if (!status.configured) {
    const appId = h("input", {type:"text", placeholder:"Adzuna App ID"});
    const appKey = h("input", {type:"password", placeholder:"Adzuna App Key"});
    const connect = h("button", {class:"btn primary"}, "Connect job search");
    connect.addEventListener("click", async () => {
      connect.disabled = true;
      try {
        status = await api("/api/discovery/config", {
          method:"POST",
          body:JSON.stringify({app_id:appId.value, app_key:appKey.value})
        });
        setup.replaceChildren(
          h("h3", {}, "Job search connected"),
          h("p", {class:"meta"}, "Saved locally on this Mac. You can search now.")
        );
      } catch (error) {
        alert(error.message);
      } finally {
        connect.disabled = false;
      }
    });
    setup = h("div", {class:"panel setup"},
      h("h3", {}, "One-time setup"),
      h("p", {class:"meta"}, "Enter your Adzuna App ID and App Key. They stay in the ignored local data folder."),
      h("div", {class:"form"},
        h("label", {}, "App ID", appId),
        h("label", {}, "App Key", appKey)
      ),
      h("div", {class:"toolbar"}, connect)
    );
  }

  show(
    h("h1", {}, "Find roles"),
    h("p", {class:"sub"}, "New placements first, ranked against your evidence. Hidden roles stay hidden."),
    setup,
    h("div", {class:"panel form"},
      h("label", {}, "Preferred location", locationInput),
      h("label", {}, "Minimum relevance %", relevanceInput),
      h("div", {class:"wide toolbar"}, searchButton),
      h("p", {class:"wide mini"}, "Your search settings are remembered automatically.")
    ),
    resultsBox
  );
}

async function route() {
  const page = location.hash.slice(2) || "";
  try {
    if (page === "find") await findRoles();
    else if (page === "applications") await applications();
    else if (page === "companies") await companies();
    else if (page === "profile") await profile();
    else await home();
  } catch (error) {
    show(h("p", {}, "Could not load: " + error.message));
  }
}
window.addEventListener("hashchange", route);
route();
</script>
</body>
</html>
